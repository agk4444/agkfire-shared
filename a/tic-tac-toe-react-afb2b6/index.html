<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0d17"/>
<title>Tic-Tac-Toe &middot; React</title>
<style>
  :root{
    --bg:#0b0d17; --panel:#141830; --panel-2:#1c2142;
    --line:#2a3160; --txt:#eef1ff; --dim:#8b93c4;
    --x:#3ddc97; --o:#ff8a5c; --gold:#ffd166;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overscroll-behavior:none}
  body{
    background:radial-gradient(1100px 620px at 50% -10%, #24306b 0%, #0b0d17 62%) fixed;
    color:var(--txt);
    font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));
    touch-action:manipulation;
  }
  .wrap{max-width:880px;margin:0 auto;display:grid;gap:16px}
  @media (min-width:760px){ .wrap{grid-template-columns:minmax(0,1fr) 320px;align-items:start} }

  .head{display:flex;align-items:center;gap:12px;justify-content:space-between}
  h1{margin:0;font-size:clamp(20px,5.2vw,28px);letter-spacing:-.02em}
  h1 span{color:var(--dim);font-weight:500}
  .badge{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}

  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:var(--r);padding:14px}

  /* board */
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
  .sq{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:16px;
    background:rgba(255,255,255,.03);color:var(--txt);font-size:clamp(38px,13vw,64px);font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .2s ease}
  .sq:hover:not(:disabled){background:rgba(255,255,255,.07);border-color:#3b4590}
  .sq:active:not(:disabled){transform:scale(.96)}
  .sq:focus-visible{outline:2px solid var(--x);outline-offset:3px}
  .sq:disabled{cursor:default}
  .sq.x{color:var(--x);text-shadow:0 0 22px rgba(61,220,151,.35)}
  .sq.o{color:var(--o);text-shadow:0 0 22px rgba(255,138,92,.35)}
  .sq.win{background:rgba(61,220,151,.14);border-color:var(--x);box-shadow:0 0 0 1px var(--x) inset,0 8px 30px rgba(61,220,151,.18)}
  .sq.win.o-win{background:rgba(255,138,92,.14);border-color:var(--o);box-shadow:0 0 0 1px var(--o) inset,0 8px 30px rgba(255,138,92,.18)}
  .sq .mark{animation:pop .22s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* status */
  .status{min-height:44px;display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--x);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .status small{display:block;font-weight:500;color:var(--dim);font-size:13px}

  /* controls */
  .seg{display:flex;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:12px;padding:5px;margin-bottom:10px}
  .seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--dim);
    font:600 14px/1 inherit;cursor:pointer;padding:0 6px}
  .seg button[aria-pressed="true"]{background:var(--x);color:#05221a}
  .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 6px 2px}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);cursor:pointer;
    background:rgba(255,255,255,.05);color:var(--txt);font:600 15px/1 inherit;padding:0 10px}
  button.btn:hover:not(:disabled){background:rgba(255,255,255,.1)}
  button.btn:disabled{opacity:.4;cursor:default}
  button.btn.primary{background:var(--x);border-color:var(--x);color:#05221a}
  button.btn.primary:hover{filter:brightness(1.08)}
  button.btn.full{grid-column:1/-1}

  .score{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;text-align:center}
  .score b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
  .score .me b{color:var(--x)} .score .ai b{color:var(--o)} .score .dr b{color:var(--gold)}
  .score span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .dash{color:var(--line);font-size:20px}
  .meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:11px;
    border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
  .meta b{color:var(--txt);font-variant-numeric:tabular-nums}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .boot{max-width:420px;margin:80px auto;background:#2a120f;border:1px solid #a3421f;
    border-radius:14px;padding:18px;color:#ffd9c9;text-align:center}
  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:14px}
  kbd{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font:600 12px ui-monospace,monospace}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>

<script>
(function () {
  function bootFail(msg) {
    document.getElementById('root').innerHTML =
      '<div class="boot"><b>Could not start.</b><br>' + msg + '</div>';
  }
  if (!window.React || !window.ReactDOM) { bootFail('React failed to load from the CDN. Check your connection and reload.'); return; }
  if (!window.htm) { bootFail('htm failed to load from the CDN. Check your connection and reload.'); return; }

  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef, useCallback = React.useCallback;
  var html = window.htm.bind(React.createElement);

  /* ---------- game rules ---------- */
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var EMPTY = [0,0,0,0,0,0,0,0,0];
  var X = 1, O = 2;

  function winLine(b) {
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return l;
    }
    return null;
  }
  function winnerOf(b) {
    var l = winLine(b);
    if (l) return b[l[0]];
    for (var i = 0; i < 9; i++) if (!b[i]) return 0;
    return 3; // draw
  }
  // 0 = finished, otherwise whose turn it is
  function turnOf(b) {
    if (winnerOf(b)) return 0;
    var x = 0, o = 0;
    for (var i = 0; i < 9; i++) { if (b[i] === X) x++; else if (b[i] === O) o++; }
    return x === o ? X : O;
  }
  function movesOf(b) { var r = []; for (var i = 0; i < 9; i++) if (!b[i]) r.push(i); return r; }

  // negamax with alpha-beta. depth 0 = horizon (no score yet).
  function search(b, me, depth, alpha, beta) {
    var w = winnerOf(b);
    if (w === me) return 10 + depth;        // win, prefer faster
    if (w && w !== 3) return -(10 + depth);  // loss, prefer slower
    if (w === 3) return 0;                  // draw
    if (depth === 0) return 0;
    var them = me === X ? O : X, best = -Infinity, open = movesOf(b);
    for (var i = 0; i < open.length; i++) {
      b[open[i]] = me;
      var s = -search(b, them, depth - 1, -beta, -alpha);
      b[open[i]] = 0;
      if (s > best) best = s;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  var DIFFS = {
    easy:   { depth: 2, chance: 0.75, label: 'Easy' },
    medium: { depth: 4, chance: 0.28, label: 'Medium' },
    hard:   { depth: 9, chance: 0,    label: 'Hard' }
  };

  function pickMove(board, me, diffKey) {
    var d = DIFFS[diffKey] || DIFFS.hard;
    var open = movesOf(board);
    if (!open.length) return -1;
    if (Math.random() < d.chance) return open[(Math.random() * open.length) | 0];
    var b = board.slice(), best = -Infinity, bestIdx = open[0];
    for (var i = 0; i < open.length; i++) {
      b[open[i]] = me;
      var s = search(b, me === X ? O : X, d.depth - 1, -Infinity, Infinity);
      b[open[i]] = 0;
      if (s > best) { best = s; bestIdx = open[i]; }
    }
    return bestIdx;
  }

  /* ---------- UI ---------- */
  function App() {
    var s0 = useState(EMPTY), board = s0[0], setBoard = s0[1];
    var s1 = useState(1), you = s1[0], setYou = s1[1];          // mark the human plays
    var s2 = useState('medium'), diff = s2[0], setDiff = s2[1];
    var s3 = useState([]), hist = s3[0], setHist = s3[1];       // board snapshots before human moves
    var s4 = useState(0), round = s4[0], setRound = s4[1];
    var s5 = useState({ you: 0, ai: 0, draw: 0 }), score = s5[0], setScore = s5[1];
    var scored = useRef(-1);

    var ai = you === X ? O : X;
    var winner = winnerOf(board);
    var status = winner === 0 ? 'playing' : winner === 3 ? 'draw' : 'win';
    var line = winLine(board);
    var ply = board.filter(Boolean).length;

    // AI answers after the human moves
    useEffect(function () {
      if (status !== 'playing' || turnOf(board) !== ai) return;
      var t = setTimeout(function () {
        setBoard(function (prev) {
          if (winnerOf(prev)) return prev;
          var i = pickMove(prev, ai, diff);
          if (i < 0) return prev;
          var nb = prev.slice(); nb[i] = ai; return nb;
        });
      }, 340);
      return function () { clearTimeout(t); };
    }, [board, status, diff, ai]);

    // score exactly once per finished round
    useEffect(function () {
      if (status === 'playing' || scored.current === round) return;
      scored.current = round;
      setScore(function (s) {
        var n = Object.assign({}, s);
        if (winner === 3) n.draw++;
        else if (winner === you) n.you++;
        else n.ai++;
        return n;
      });
    }, [status, winner, round, you]);

    var newRound = useCallback(function () {
      setBoard(EMPTY); setHist([]); setRound(function (r) { return r + 1; });
    }, []);

    var play = useCallback(function (i) {
      if (status !== 'playing' || turnOf(board) !== you || board[i]) return;
      setHist(function (h) { return h.concat([board]); });
      setBoard(function (b) { var nb = b.slice(); nb[i] = you; return nb; });
    }, [board, status, you]);

    var undo = useCallback(function () {
      if (!hist.length) return;
      setBoard(hist[hist.length - 1]);
      setHist(function (h) { return h.slice(0, -1); });
    }, [hist]);

    var reset = useCallback(function () {
      setScore({ you: 0, ai: 0, draw: 0 });
      setBoard(EMPTY); setHist([]); scored.current = -1;
      setRound(function (r) { return r + 1; });
    }, []);

    function msg() {
      if (status === 'win') return winner === you ? 'You win' : 'AI wins';
      if (status === 'draw') return 'Draw';
      return 'Your move';
    }
    function sub() {
      if (status === 'win') return winner === you ? 'Clean game.' : 'Rematch? Undo or go again.';
      if (status === 'draw') return 'Nobody blinked.';
      return 'You play ' + (you === X ? 'X' : 'O') + ' · ' + DIFFS[diff].label +
        (you === X ? '' : ' · AI opens');
    }

    return html`
      <${React.Fragment}>
        <div class="wrap">
          <div>
            <div class="head">
              <h1>Tic-Tac-Toe <span>&middot; React</span></h1>
              <div class="badge">v1.0</div>
            </div>

            <div class="card" style=${{ marginTop: 12 }}>
              <div class="status" role="status" aria-live="polite">
                <span class=${'dot' + (status === 'playing' ? ' live' : '')}></span>
                <span>${msg()}<small>${sub()}</small></span>
              </div>

              <div class="board" role="grid" aria-label="Tic-tac-toe board">
                ${board.map(function (v, i) {
                  var isWin = line && line.indexOf(i) >= 0;
                  var cls = 'sq' + (v === X ? ' x' : v === O ? ' o' : '') +
                            (isWin ? ' win' : '') + (isWin && v === O ? ' o-win' : '');
                  return html`
                    <button key=${i} class=${cls} data-i=${i} role="gridcell"
                      aria-label=${'Cell ' + (i + 1) + ', ' + (v ? (v === X ? 'X' : 'O') : 'empty')}
                      disabled=${status !== 'playing' || turnOf(board) !== you || !!v}
                      onClick=${function () { play(i); }}>
                      ${v ? html`<span class="mark">${v === X ? 'X' : 'O'}</span>` : null}
                    </button>`;
                })}
              </div>

              <div class="btns" style=${{ marginTop: 12 }}>
                <button class="btn primary full" onClick=${newRound}>
                  ${status === 'playing' ? 'New round' : 'Play again'}
                </button>
                <button class="btn" onClick=${undo} disabled=${!hist.length}>Undo move</button>
                <button class="btn" onClick=${reset}>Reset score</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="score">
              <div class="me"><b>${score.you}</b><span>You</span></div>
              <div class="dash">:</div>
              <div class="dr"><b>${score.draw}</b><span>Draws</span></div>
              <div class="dash">:</div>
              <div class="ai"><b>${score.ai}</b><span>AI</span></div>
            </div>

            <div class="meta">
              <span>Round <b>${round + 1}</b></span>
              <span>Moves <b>${ply}</b>/9</span>
            </div>

            <div style=${{ marginTop: 16 }}>
              <p class="lbl">Difficulty</p>
              <div class="seg" role="group" aria-label="Difficulty">
                ${['easy', 'medium', 'hard'].map(function (k) {
                  return html`<button key=${k} aria-pressed=${diff === k}
                    onClick=${function () { setDiff(k); }}>${DIFFS[k].label}</button>`;
                })}
              </div>

              <p class="lbl">You play</p>
              <div class="seg" role="group" aria-label="Side">
                <button aria-pressed=${you === X} onClick=${function () { setYou(X); newRound(); }}>X &middot; first</button>
                <button aria-pressed=${you === O} onClick=${function () { setYou(O); newRound(); }}>O &middot; second</button>
              </div>
            </div>

            <p class="foot" style=${{ marginTop: 14 }}>
              Hard is unbeatable &middot; <kbd>Tab</kbd> moves, <kbd>Enter</kbd> plays
            </p>
          </div>
        </div>
      <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
